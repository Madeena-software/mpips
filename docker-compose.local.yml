services:
  mpips-api:
    image: mpips-api:${MPIPS_VERSION:-local}
    user: "${MPIPS_LOCAL_UID:-1000}:${MPIPS_LOCAL_GID:-1000}"
    group_add:
      - "${MPIPS_LAUNCHER_GID:-1000}"
    environment:
      MPIPS_ENVIRONMENT: production
      MPIPS_API_WORKERS: "1"
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      MPIPS_LAUNCHER_SOCKET_PATH: /var/run/mpips-local/launcher.sock
      MPIPS_WORKER_IMAGE: ${MPIPS_WORKER_IMAGE:-mpips-npz-worker:local}
      MPIPS_CALIBRATION_ARTIFACT_DIR: /opt/mpips/calibration
      MPIPS_DICOM_MAX_MANIFEST_BYTES: "104857600"
      MPIPS_DICOM_MAX_RADIOGRAPH_BYTES: "104857600"
      MPIPS_DICOM_MAX_GAIN_BYTES: "104857600"
      MPIPS_DICOM_MAX_TOTAL_BYTES: "314572800"
      MPIPS_MAX_HTTP_REQUEST_BODY_BYTES: "325058560"
      MPIPS_DICOM_PROCESS_TIMEOUT_SECONDS: ${MPIPS_DICOM_PROCESS_TIMEOUT_SECONDS:-120}
      MPIPS_DICOM_IDEMPOTENCY_TTL_SECONDS: "60"
      MPIPS_DICOM_WORKER_CPU_SECONDS: ${MPIPS_DICOM_WORKER_CPU_SECONDS:-120}
      MPIPS_DICOM_WORKER_MEMORY_BYTES: ${MPIPS_DICOM_WORKER_MEMORY_BYTES:-4294967296}
      MPIPS_DICOM_MAX_CONCURRENT_CONVERSIONS: "2"
      MPIPS_DICOM_MAX_TIFF_BYTES: ${MPIPS_DICOM_MAX_TIFF_BYTES:-104857600}
    ports:
      - "127.0.0.1:${MPIPS_LOCAL_PORT:-8000}:8000"
    volumes:
      - /tmp/mpips-workspaces:/tmp/mpips-workspaces:rw
      - ${MPIPS_CALIBRATION_DIR:?set calibration dir}:/opt/mpips/calibration:ro
      - ${MPIPS_LAUNCHER_DIR:?set launcher dir}:/var/run/mpips-local:rw
    networks:
      - mpips-local-private
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1g
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks:
      - mpips-local-private
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "0.5"
    mem_limit: 256m
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  mpips-local-private:
    name: mpips-local-private-v1
