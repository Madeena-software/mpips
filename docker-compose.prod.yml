services:
  mpips-api:
    image: mpips-api:${MPIPS_VERSION:?set MPIPS_VERSION}
    user: "${MPIPS_RUNTIME_UID:-10001}:${MPIPS_RUNTIME_GID:-10001}"
    group_add:
      - "${MPIPS_LAUNCHER_GID:?set MPIPS_LAUNCHER_GID}"
    environment:
      MPIPS_ENVIRONMENT: production
      MPIPS_API_KEY: ${MPIPS_API_KEY:?set MPIPS_API_KEY}
      MPIPS_API_WORKERS: "1"
      PORT: "8000"
      MPIPS_VERSION: ${MPIPS_VERSION:?set MPIPS_VERSION}
      REDIS_URL: redis://redis:6379/0
      MPIPS_LAUNCHER_SOCKET_PATH: /var/run/mpips/launcher.sock
      MPIPS_WORKER_IMAGE: mpips-npz-worker:${MPIPS_VERSION:?set MPIPS_VERSION}
      MPIPS_CALIBRATION_ARTIFACT_DIR: /opt/mpips/calibration
      MPIPS_DICOM_MAX_MANIFEST_BYTES: "104857600"
      MPIPS_DICOM_MAX_RADIOGRAPH_BYTES: "104857600"
      MPIPS_DICOM_MAX_GAIN_BYTES: "104857600"
      MPIPS_DICOM_MAX_TOTAL_BYTES: "314572800"
      MPIPS_MAX_HTTP_REQUEST_BODY_BYTES: "325058560"
      MPIPS_DICOM_PROCESS_TIMEOUT_SECONDS: "300"
      MPIPS_DICOM_IDEMPOTENCY_TTL_SECONDS: "86400"
      MPIPS_DICOM_WORKER_CPU_SECONDS: "120"
      MPIPS_DICOM_WORKER_MEMORY_BYTES: "4294967296"
      MPIPS_DICOM_MAX_CONCURRENT_CONVERSIONS: "2"
      MPIPS_DICOM_MAX_TIFF_BYTES: "104857600"
    ports:
      - "127.0.0.1:8014:8000"
    volumes:
      - /tmp/mpips-workspaces:/tmp/mpips-workspaces:rw
      - ${REMOTE_PATH:?set REMOTE_PATH}/calibration:/opt/mpips/calibration:ro
      - ${REMOTE_PATH:?set REMOTE_PATH}/launcher:/var/run/mpips:rw
    networks:
      - madeena-software-network
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks:
      - madeena-software-network
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  madeena-software-network:
    external: true
    name: madeena-software-network
