# Reverse-proxy routing snippet for ip.mhcsgo.cloud -> MPIPS Staging Update Server
# Isolates /mpips/staging/* routes on loopback 127.0.0.1:8015 without altering
# the clinical MPIPS DICOM conversion API (127.0.0.1:8014) or SIMRS routes.

upstream mpips_update_staging {
    server 127.0.0.1:8015;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name ip.mhcsgo.cloud;

    ssl_certificate     /etc/letsencrypt/live/ip.mhcsgo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip.mhcsgo.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /mpips/staging/health {
        limit_except GET { deny all; }
        proxy_pass http://mpips_update_staging/mpips/staging/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /mpips/staging/latest.json {
        limit_except GET { deny all; }
        proxy_pass http://mpips_update_staging/mpips/staging/latest.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/mpips/staging/releases/[A-Za-z0-9][A-Za-z0-9._-]*/download$ {
        limit_except GET { deny all; }
        proxy_pass http://mpips_update_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}

