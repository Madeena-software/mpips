name: MPIPS CI

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: [self-hosted, production]
    timeout-minutes: 60
    env:
      API_IMAGE: mpips-api:ci-${{ github.sha }}
      WORKER_IMAGE: mpips-npz-worker:ci-${{ github.sha }}
      CI_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Self-hosted runner preflight
        run: |
          set -Eeuo pipefail
          uname -a
          id
          docker version
          docker info
          docker compose version
          curl --version

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.12.5" "pip-audit==2.10.1"

      - name: Sync dependencies with uv
        run: |
          uv sync --frozen --extra service --extra dev --extra npz-worker --extra imager --extra calibration

      - name: Audit locked dependency closures
        run: |
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT
          uv lock --check

          uv export \
            --frozen \
            --no-dev \
            --extra service \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$TMPDIR/api-runtime.txt" \
            > /dev/null
          echo "Auditing API runtime dependencies"
          pip-audit --require-hashes -r "$TMPDIR/api-runtime.txt"

          uv export \
            --frozen \
            --no-dev \
            --extra imager \
            --extra npz-worker \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$TMPDIR/worker-runtime.txt" \
            > /dev/null
          echo "Auditing NPZ worker dependencies"
          pip-audit --require-hashes -r "$TMPDIR/worker-runtime.txt"

          uv export \
            --frozen \
            --extra service \
            --extra dev \
            --extra npz-worker \
            --extra calibration \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$TMPDIR/ci-test.txt" \
            > /dev/null
          echo "Auditing CI/test dependencies"
          pip-audit --require-hashes -r "$TMPDIR/ci-test.txt"

      - name: Verify Converter SHA-256 Immutability
        run: |
          EXPECTED_HASH="a4a308661ebe8e418bbecd6f30af1b59eae3ee019fc4256b03b323be3c6706e0"
          LEGACY_PATH="mpips/engine/imager_pipeline/tiff_json_to_dcm.py"
          CANONICAL_PATH="mpips/conversion/tiff_json_to_dcm.py"
          echo "Protected converter path: $CANONICAL_PATH"
          if [ ! -f "$CANONICAL_PATH" ]; then
            echo "Canonical converter is missing or not a regular file."
            exit 1
          fi
          if [ -e "$LEGACY_PATH" ]; then
            echo "Legacy converter path must not exist: $LEGACY_PATH"
            exit 1
          fi
          ACTUAL_HASH=$(sha256sum "$CANONICAL_PATH" | awk '{print $1}')
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "Pak Andre's converter was modified!"
            exit 1
          fi

      - name: Run Black Check
        run: |
          uv run black --check mpips tests

      - name: Run Flake8 Check
        run: |
          uv run flake8 mpips tests

      - name: Run Mypy Regression Gate
        env:
          MYPY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run python scripts/check_mypy_regressions.py \
            --base-ref "${MYPY_BASE_SHA:-HEAD^}" \
            --candidate-ref "$GITHUB_SHA"

      - name: Run pytest Suite
        run: |
          uv run pytest -v

      - name: Build API Docker Image
        run: |
          docker build -t "$API_IMAGE" -f Dockerfile .

      - name: Build NPZ Worker Docker Image
        run: |
          docker build -t "$WORKER_IMAGE" -f docker/Dockerfile.worker .

      - name: Run Production Lifespan Container Smoke Test
        run: |
          set -Eeuo pipefail
          API_CONTAINER="mpips-ci-api-$CI_RUN_SUFFIX"
          REDIS_CONTAINER="mpips-ci-redis-$CI_RUN_SUFFIX"
          NETWORK="mpips-ci-network-$CI_RUN_SUFFIX"
          REDIS_IMAGE="redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2"

          cleanup() {
            docker rm -f "$API_CONTAINER" "$REDIS_CONTAINER" >/dev/null 2>&1 || true
            docker network rm "$NETWORK" >/dev/null 2>&1 || true
            docker image rm "$API_IMAGE" "$WORKER_IMAGE" >/dev/null 2>&1 || true
          }
          cleanup
          trap cleanup EXIT

          docker network create "$NETWORK"
          docker run -d --name "$REDIS_CONTAINER" --network "$NETWORK" "$REDIS_IMAGE"

          redis_ready=false
          for attempt in $(seq 1 60); do
            if [ "$(docker exec "$REDIS_CONTAINER" redis-cli ping 2>/dev/null || true)" = "PONG" ]; then
              redis_ready=true
              echo "temporary Redis PONG (attempt $attempt)"
              break
            fi
            sleep 2
          done
          if [ "$redis_ready" != true ]; then
            docker inspect "$REDIS_CONTAINER"
            docker logs "$REDIS_CONTAINER"
            exit 1
          fi

          docker run -d --name "$API_CONTAINER" --network "$NETWORK" \
            -e MPIPS_ENVIRONMENT=production \
            -e DEV_AUTH_BYPASS=false \
            -e MPIPS_MANIFEST_HMAC_SECRET=c8e73f91d0a5491fb3421e89b70c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c \
            -e MADEENA_IDP_JWKS_URL=https://sso.madeena.com/.well-known/jwks.json \
            -e MADEENA_IDP_ISSUER=https://sso.madeena.com \
            -e MADEENA_IDP_AUDIENCE=https://api.madeena.com \
            -e MPIPS_API_KEY=ci-only-dummy-key \
            -e REDIS_URL="redis://$REDIS_CONTAINER:6379/0" \
            -p 127.0.0.1::8000 \
            "$API_IMAGE"

          HOST_PORT="$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8000/tcp") 0).HostPort}}' "$API_CONTAINER")"
          echo "API mapped localhost port: $HOST_PORT"
          first_error=""
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:$HOST_PORT/health" >/dev/null; then
              echo "API production readiness PASS (attempt $attempt)"
              echo "/health HTTP 200 PASS"
              exit 0
            fi
            if [ -z "$first_error" ]; then
              first_error="attempt $attempt: $(curl --silent --show-error --output /dev/null "http://127.0.0.1:$HOST_PORT/health" 2>&1 || true)"
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$API_CONTAINER")" != true ]; then
              echo "API container exited during readiness"
              docker inspect "$API_CONTAINER"
              docker logs "$API_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          echo "API readiness timed out after 60 attempts"
          echo "First curl error: $first_error"
          echo "Last curl error: $(curl --silent --show-error --output /dev/null "http://127.0.0.1:$HOST_PORT/health" 2>&1 || true)"
          docker inspect "$API_CONTAINER"
          docker logs "$API_CONTAINER"
          exit 1

      - name: Clean up CI Docker resources
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          API_CONTAINER="mpips-ci-api-$CI_RUN_SUFFIX"
          REDIS_CONTAINER="mpips-ci-redis-$CI_RUN_SUFFIX"
          NETWORK="mpips-ci-network-$CI_RUN_SUFFIX"
          docker rm -f "$API_CONTAINER" "$REDIS_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$NETWORK" >/dev/null 2>&1 || true
          docker image rm "$API_IMAGE" "$WORKER_IMAGE" >/dev/null 2>&1 || true
