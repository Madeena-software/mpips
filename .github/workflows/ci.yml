name: MPIPS CI

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.12.5" "pip-audit==2.10.1"

      - name: Sync dependencies with uv
        run: |
          uv sync --frozen --extra service --extra dev --extra npz-worker --extra calibration

      - name: Audit locked dependency closures
        run: |
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT
          uv lock --check

          uv export \
            --frozen \
            --no-dev \
            --extra service \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$TMPDIR/api-runtime.txt" \
            > /dev/null
          echo "Auditing API runtime dependencies"
          pip-audit --require-hashes -r "$TMPDIR/api-runtime.txt"

          uv export \
            --frozen \
            --no-dev \
            --extra imager \
            --extra npz-worker \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$TMPDIR/worker-runtime.txt" \
            > /dev/null
          echo "Auditing NPZ worker dependencies"
          pip-audit --require-hashes -r "$TMPDIR/worker-runtime.txt"

          uv export \
            --frozen \
            --extra service \
            --extra dev \
            --extra npz-worker \
            --extra calibration \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$TMPDIR/ci-test.txt" \
            > /dev/null
          echo "Auditing CI/test dependencies"
          pip-audit --require-hashes -r "$TMPDIR/ci-test.txt"

      - name: Verify Converter SHA-256 Immutability
        run: |
          EXPECTED_HASH="a4a308661ebe8e418bbecd6f30af1b59eae3ee019fc4256b03b323be3c6706e0"
          LEGACY_PATH="mpips/engine/imager_pipeline/tiff_json_to_dcm.py"
          CANONICAL_PATH="mpips/conversion/tiff_json_to_dcm.py"
          echo "Protected converter path: $CANONICAL_PATH"
          if [ ! -f "$CANONICAL_PATH" ]; then
            echo "Canonical converter is missing or not a regular file."
            exit 1
          fi
          if [ -e "$LEGACY_PATH" ]; then
            echo "Legacy converter path must not exist: $LEGACY_PATH"
            exit 1
          fi
          ACTUAL_HASH=$(sha256sum "$CANONICAL_PATH" | awk '{print $1}')
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "Pak Andre's converter was modified!"
            exit 1
          fi

      - name: Run Code Quality Checks
        run: |
          uv run black --check mpips tests scripts
          uv run flake8 mpips tests scripts
          uv run mypy mpips tests scripts

      - name: Run pytest Suite
        run: |
          uv run pytest -v

      - name: Build API Docker Image
        run: |
          docker build -t mpips-api:latest -f Dockerfile .

      - name: Build NPZ Worker Docker Image
        run: |
          docker build -t mpips-npz-worker:latest -f docker/Dockerfile.worker .

      - name: Run Production Lifespan Container Smoke Test
        run: |
          docker run -d --name test-api \
            -e MPIPS_ENVIRONMENT=production \
            -e DEV_AUTH_BYPASS=false \
            -e MPIPS_MANIFEST_HMAC_SECRET=c8e73f91d0a5491fb3421e89b70c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c \
            -e MADEENA_IDP_JWKS_URL=https://sso.madeena.com/.well-known/jwks.json \
            -e MADEENA_IDP_ISSUER=https://sso.madeena.com \
            -e MADEENA_IDP_AUDIENCE=https://api.madeena.com \
            -e REDIS_URL=redis://localhost:6379/0 \
            -p 8000:8000 \
            mpips-api:latest
          
          sleep 3
          curl --fail http://localhost:8000/health || (docker logs test-api && exit 1)
          docker rm -f test-api
