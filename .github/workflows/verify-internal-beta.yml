name: Verify MPIPS Internal Beta

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy MPIPS Internal Beta"]
    types: [completed]

concurrency:
  group: mpips-internal-beta
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  verify:
    name: Functional Verification
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra service --extra dev --extra npz-worker --extra imager

      - name: Set deployment variables
        run: |
          echo "REMOTE_PATH=/var/www/mpips-runtime" >> "$GITHUB_ENV"
          echo "MPIPS_LAUNCHER_SOCKET_PATH=/var/www/mpips-runtime/launcher/launcher.sock" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=mpips-internal-beta" >> "$GITHUB_ENV"

      - name: Run burn-in verification
        run: |
          set -Eeuo pipefail
          uv run python scripts/local_dicom_burn_in.py \
            --base-dir "$REMOTE_PATH/burn-in" prepare

          verify_key_status() {
            local header="$1"
            local body_file="$2"
            local status
            status=$(curl -sS -o "$body_file" -w '%{http_code}' -X POST \
              -H "$header" http://127.0.0.1:8014/v1/radiographs/dicom)
            test "$status" = "401"
            grep -Fq 'INVALID_API_KEY' "$body_file"
          }

          verify_key_status "X-MPIPS-API-Key:" "$RUNNER_TEMP/mpips-missing-key.json"
          verify_key_status "X-MPIPS-API-Key: wrong-key" "$RUNNER_TEMP/mpips-wrong-key.json"
          verify_key_status "Authorization: Bearer legacy-token" "$RUNNER_TEMP/mpips-bearer-without-key.json"

          uv run python scripts/local_dicom_burn_in.py \
            --base-dir "$REMOTE_PATH/burn-in" \
            --url http://127.0.0.1:8014 run

      - name: Show verification logs on failure
        if: failure()
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file /dev/null -f "$REMOTE_PATH/docker-compose.prod.yml" \
            logs --no-color --tail=200 || true
          test ! -f "$REMOTE_PATH/launcher.log" || tail -200 "$REMOTE_PATH/launcher.log"
