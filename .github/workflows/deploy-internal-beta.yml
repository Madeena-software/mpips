name: Deploy MPIPS Internal Beta

on:
  workflow_dispatch:
    inputs:
      recreate_internal_network:
        description: "Authorized one-time cutover: Recreate MPIPS networks if subnet/config is invalid"
        type: boolean
        default: false

concurrency:
  group: mpips-internal-beta
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  build:
    name: Build & Verify
    runs-on: [self-hosted, production]
    timeout-minutes: 60
    outputs:
      app_version: ${{ steps.set_version.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra service --extra dev --extra npz-worker --extra imager

      - name: Run focused checks
        env:
          MPIPS_ENVIRONMENT: development
        run: |
          test ! -f .agents/skills/agent-task/scripts/validate_task.py || \
            .venv/bin/python .agents/skills/agent-task/scripts/validate_task.py \
            .agents/tasks/archive/mpips-simple-key-cicd-internal-beta-v1.md
          test "$(sha256sum mpips/engine/imager_pipeline/tiff_json_to_dcm.py | awk '{print $1}')" = \
            "a4a308661ebe8e418bbecd6f30af1b59eae3ee019fc4256b03b323be3c6706e0"
          uv run pytest \
            tests/api/test_api_surface.py \
            tests/api/test_dicom_authentication.py \
            tests/api/test_dicom_conversion.py \
            tests/test_host_launcher.py \
            -q

      - name: Set deployment version
        id: set_version
        run: |
          echo "app_version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "MPIPS_VERSION=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build immutable images
        run: |
          set -Eeuo pipefail
          BUILDER=mpips-production-cache
          CACHE_ROOT="${HOME}/.cache/mpips-buildkit"
          API_CACHE="$CACHE_ROOT/api"
          WORKER_CACHE="$CACHE_ROOT/worker"
          API_CACHE_NEXT="$API_CACHE.next"
          WORKER_CACHE_NEXT="$WORKER_CACHE.next"
          mkdir -p "$CACHE_ROOT"

          if docker buildx inspect "$BUILDER" >/dev/null 2>&1; then
            docker buildx use "$BUILDER"
          else
            docker buildx create --name "$BUILDER" --driver docker-container --use
          fi
          docker buildx inspect --bootstrap "$BUILDER"

          rotate_cache() {
            local active="$1" next="$2"
            test -f "$next/index.json"
            rm -rf "$active.previous"
            if [ -d "$active" ]; then
              mv "$active" "$active.previous"
            fi
            if mv "$next" "$active"; then
              rm -rf "$active.previous"
            elif [ -d "$active.previous" ]; then
              mv "$active.previous" "$active"
              return 1
            else
              return 1
            fi
          }

          build_image() {
            local image="$1" dockerfile="$2" active="$3" next="$4"
            local cache_from=()
            rm -rf "$next"
            if [ -f "$active/index.json" ]; then
              cache_from=(--cache-from "type=local,src=$active")
            fi
            docker buildx build \
              --builder "$BUILDER" \
              --load \
              "${cache_from[@]}" \
              --cache-to "type=local,dest=$next,mode=max,ignore-error=true" \
              -t "$image" \
              -f "$dockerfile" \
              .
            docker image inspect "$image" >/dev/null
            rotate_cache "$active" "$next"
          }

          build_image "mpips-api:$MPIPS_VERSION" Dockerfile "$API_CACHE" "$API_CACHE_NEXT"
          build_image "mpips-npz-worker:$MPIPS_VERSION" docker/Dockerfile.worker "$WORKER_CACHE" "$WORKER_CACHE_NEXT"

  deploy:
    name: Deploy
    needs: build
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra service --extra dev --extra npz-worker --extra imager

      - name: Set deployment variables
        env:
          MPIPS_API_KEY_SECRET: ${{ secrets.MPIPS_API_KEY }}
        run: |
          echo "REMOTE_PATH=/var/www/mpips-runtime" >> "$GITHUB_ENV"
          echo "MPIPS_VERSION=${{ needs.build.outputs.app_version }}" >> "$GITHUB_ENV"
          echo "MPIPS_LAUNCHER_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "MPIPS_RUNTIME_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MPIPS_RUNTIME_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "MPIPS_LAUNCHER_SOCKET_PATH=/var/www/mpips-runtime/launcher/launcher.sock" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=mpips-internal-beta" >> "$GITHUB_ENV"
          echo "MPIPS_API_KEY=${MPIPS_API_KEY_SECRET}" >> "$GITHUB_ENV"
          echo "RECREATE_INTERNAL_NET=${{ inputs.recreate_internal_network || false }}" >> "$GITHUB_ENV"

      - name: Validate environment variables (require_env)
        run: |
          set -Eeuo pipefail
          for var in REMOTE_PATH MPIPS_VERSION MPIPS_API_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "Error: Required environment variable $var is missing or empty." >&2
              exit 1
            fi
          done

      - name: Prepare runtime and rollback state
        run: |
          set -Eeuo pipefail
          ensure_internal_network() {
            local net_name="mpips-internal-beta-v1"
            local exp_driver="bridge"
            local exp_subnet="10.250.2.0/24"
            local allow_recreate="${RECREATE_INTERNAL_NET:-false}"
            if docker network inspect "$net_name" >/dev/null 2>&1; then
              local driver subnet
              driver="$(docker network inspect "$net_name" --format '{{.Driver}}')"
              subnet="$(docker network inspect "$net_name" --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}')"
              if [ "$driver" != "$exp_driver" ] || [ "$subnet" != "$exp_subnet" ]; then
                if [ "$allow_recreate" = "true" ]; then
                  echo "Authorized cutover: Network $net_name has invalid config (driver=$driver, subnet=$subnet). Recreating with approved subnet $exp_subnet..."
                  docker compose --project-name "$COMPOSE_PROJECT_NAME" \
                    --env-file /dev/null -f "$REMOTE_PATH/docker-compose.prod.yml" down --remove-orphans 2>/dev/null || true
                  docker network rm "$net_name"
                  docker network create \
                    --driver "$exp_driver" \
                    --subnet "$exp_subnet" \
                    --gateway "10.250.2.1" \
                    "$net_name"
                  echo "Recreated network $net_name (driver: $exp_driver, subnet: $exp_subnet)"
                  return 0
                fi
                echo "FATAL: Network $net_name exists with invalid config (driver=$driver, subnet=$subnet, expected driver=$exp_driver, subnet=$exp_subnet)" >&2
                exit 1
              fi
              echo "Verified network $net_name (driver: $driver, subnet: $subnet)"
            else
              echo "Creating network $net_name (driver: $exp_driver, subnet: $exp_subnet)..."
              docker network create \
                --driver "$exp_driver" \
                --subnet "$exp_subnet" \
                --gateway "10.250.2.1" \
                "$net_name"
              echo "Created network $net_name"
            fi
          }

          ensure_integration_network() {
            local net_name="mhcs-mpips-integration-v1"
            local exp_driver="overlay"
            local exp_scope="swarm"
            local exp_subnet="10.250.3.0/24"
            local allow_recreate="${RECREATE_INTERNAL_NET:-false}"
            if docker network inspect "$net_name" >/dev/null 2>&1; then
              local driver scope attachable subnet
              driver="$(docker network inspect "$net_name" --format '{{.Driver}}')"
              scope="$(docker network inspect "$net_name" --format '{{.Scope}}')"
              attachable="$(docker network inspect "$net_name" --format '{{.Attachable}}')"
              subnet="$(docker network inspect "$net_name" --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}')"
              if [ "$driver" != "$exp_driver" ] || [ "$scope" != "$exp_scope" ] || [ "$attachable" != "true" ] || [ "$subnet" != "$exp_subnet" ]; then
                if [ "$allow_recreate" = "true" ]; then
                  echo "Authorized cutover: Network $net_name has invalid config (driver=$driver, scope=$scope, attachable=$attachable, subnet=$subnet). Recreating..."
                  docker network rm "$net_name"
                  docker network create \
                    --driver "$exp_driver" \
                    --attachable \
                    --subnet "$exp_subnet" \
                    --gateway "10.250.3.1" \
                    "$net_name"
                  echo "Recreated network $net_name (driver: $exp_driver, attachable: true, subnet: $exp_subnet)"
                  return 0
                fi
                echo "FATAL: Network $net_name exists with invalid config (driver=$driver, scope=$scope, attachable=$attachable, subnet=$subnet)" >&2
                exit 1
              fi
              echo "Verified network $net_name (driver: $driver, scope: $scope, attachable: $attachable, subnet: $subnet)"
            else
              echo "Creating network $net_name (driver: $exp_driver, attachable: true, subnet: $exp_subnet)..."
              docker network create \
                --driver "$exp_driver" \
                --attachable \
                --subnet "$exp_subnet" \
                --gateway "10.250.3.1" \
                "$net_name"
              echo "Created network $net_name"
            fi
          }

          ensure_internal_network
          ensure_integration_network

          if [ ! -d "$REMOTE_PATH" ]; then
            sudo mkdir -p "$REMOTE_PATH"
            sudo chown -R "$(id -u):$(id -g)" "$REMOTE_PATH"
          fi
          mkdir -p "$REMOTE_PATH/calibration" "$REMOTE_PATH/launcher" /tmp/mpips-workspaces
          uv run python scripts/validate_calibration_layout.py "$REMOTE_PATH/calibration"
          uv run python scripts/local_dicom_burn_in.py \
            --base-dir "$REMOTE_PATH/burn-in" prepare
          if [ -f "$REMOTE_PATH/docker-compose.prod.yml" ]; then
            cp "$REMOTE_PATH/docker-compose.prod.yml" \
              "$REMOTE_PATH/docker-compose.prod.yml.previous"
            echo "MPIPS_HAS_PREVIOUS_COMPOSE=true" >> "$GITHUB_ENV"
          else
            echo "MPIPS_HAS_PREVIOUS_COMPOSE=false" >> "$GITHUB_ENV"
          fi
          if [ -f "$REMOTE_PATH/.mpips-version" ]; then
            echo "MPIPS_PREVIOUS_VERSION=$(cat "$REMOTE_PATH/.mpips-version")" >> "$GITHUB_ENV"
          else
            echo "MPIPS_PREVIOUS_VERSION=" >> "$GITHUB_ENV"
          fi
          if [ -f "$REMOTE_PATH/.mpips-worker-image" ]; then
            echo "MPIPS_PREVIOUS_WORKER_IMAGE=$(cat "$REMOTE_PATH/.mpips-worker-image")" >> "$GITHUB_ENV"
          else
            echo "MPIPS_PREVIOUS_WORKER_IMAGE=mpips-npz-worker:internal-beta" >> "$GITHUB_ENV"
          fi
          cp docker-compose.prod.yml "$REMOTE_PATH/docker-compose.prod.yml"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file /dev/null -f "$REMOTE_PATH/docker-compose.prod.yml" config >/dev/null

      - name: Start versioned worker launcher
        run: |
          set -Eeuo pipefail
          PID_FILE="$REMOTE_PATH/launcher.pid"
          if [ -f "$PID_FILE" ]; then
            old_pid=$(cat "$PID_FILE" || true)
            if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then
              kill "$old_pid"
              for _ in $(seq 1 20); do
                kill -0 "$old_pid" 2>/dev/null || break
                sleep 1
              done
            fi
          fi
          rm -f "$REMOTE_PATH/launcher/launcher.sock" "$PID_FILE"
          RUNNER_TRACKING_ID="" \
          MPIPS_LAUNCHER_SOCKET_PATH="$REMOTE_PATH/launcher/launcher.sock" \
          MPIPS_WORKSPACE_ROOT=/tmp/mpips-workspaces \
          MPIPS_WORKER_IMAGE="mpips-npz-worker:$MPIPS_VERSION" \
          MPIPS_WORKER_USER="$MPIPS_RUNTIME_UID:$MPIPS_RUNTIME_GID" \
          nohup .venv/bin/python docker/host-launcher/mpips-launcher.py \
            > "$REMOTE_PATH/launcher.log" 2>&1 &
          echo $! > "$PID_FILE"
          for _ in $(seq 1 20); do
            test -S "$REMOTE_PATH/launcher/launcher.sock" && exit 0
            sleep 1
          done
          echo "launcher socket did not appear" >&2
          exit 1

      - name: Deploy Compose services
        run: |
          set -Eeuo pipefail
          docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file /dev/null -f "$REMOTE_PATH/docker-compose.prod.yml" up -d --remove-orphans

      - name: Verify deployment readiness and rollback on failure
        run: |
          set -Eeuo pipefail
          COMPOSE=(docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file /dev/null -f "$REMOTE_PATH/docker-compose.prod.yml")
          API_CONTAINER="$(${COMPOSE[@]} ps -q mpips-api)"
          REDIS_CONTAINER="$(${COMPOSE[@]} ps -q redis)"
          wait_for_health() {
            for _ in $(seq 1 60); do
              curl -fsS http://127.0.0.1:8014/health >/dev/null && return 0
              sleep 2
            done
            return 1
          }
          live_checks() {
            wait_for_health
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8014/health)" = "200"
            test "$(docker port "$API_CONTAINER" 8000/tcp)" = "127.0.0.1:8014"
            test -z "$(docker port "$REDIS_CONTAINER" || true)"

            local api_networks redis_networks
            api_networks="$(docker inspect "$API_CONTAINER" --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}} {{end}}')"
            redis_networks="$(docker inspect "$REDIS_CONTAINER" --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}} {{end}}')"

            echo "$api_networks" | grep -qw 'mpips-internal-beta-v1'
            echo "$api_networks" | grep -qw 'mhcs-mpips-integration-v1'

            echo "$redis_networks" | grep -qw 'mpips-internal-beta-v1'
            ! echo "$redis_networks" | grep -qw 'mhcs-mpips-integration-v1'

            docker run --rm --network mhcs-mpips-integration-v1 \
              "mpips-api:$MPIPS_VERSION" \
              curl -fsS http://mpips-api:8000/health >/dev/null
            ! docker compose --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file /dev/null -f "$REMOTE_PATH/docker-compose.prod.yml" config | \
              grep -Eiq 'latest|nginx|jwks'
          }
          if ! live_checks; then
            echo "live verification failed; restoring the previous Compose deployment" >&2
            "${COMPOSE[@]}" logs --no-color --tail=200 || true
            "${COMPOSE[@]}" down --remove-orphans || true
            if [ "$MPIPS_HAS_PREVIOUS_COMPOSE" = "true" ] && [ -n "$MPIPS_PREVIOUS_VERSION" ]; then
              cp "$REMOTE_PATH/docker-compose.prod.yml.previous" "$REMOTE_PATH/docker-compose.prod.yml"
              MPIPS_VERSION="$MPIPS_PREVIOUS_VERSION" "${COMPOSE[@]}" up -d || true
              if [ -f "$REMOTE_PATH/launcher.pid" ]; then
                old_pid=$(cat "$REMOTE_PATH/launcher.pid" || true)
                if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then
                  kill "$old_pid" || true
                fi
              fi
              rm -f "$REMOTE_PATH/launcher/launcher.sock"
              RUNNER_TRACKING_ID="" \
              MPIPS_LAUNCHER_SOCKET_PATH="$REMOTE_PATH/launcher/launcher.sock" \
              MPIPS_WORKSPACE_ROOT=/tmp/mpips-workspaces \
              MPIPS_WORKER_IMAGE="$MPIPS_PREVIOUS_WORKER_IMAGE" \
              MPIPS_WORKER_USER="$MPIPS_RUNTIME_UID:$MPIPS_RUNTIME_GID" \
              nohup .venv/bin/python docker/host-launcher/mpips-launcher.py \
                > "$REMOTE_PATH/launcher.log" 2>&1 &
              echo $! > "$REMOTE_PATH/launcher.pid"
            fi
            exit 1
          fi
          printf '%s\n' "$MPIPS_VERSION" > "$REMOTE_PATH/.mpips-version"
          printf 'mpips-npz-worker:%s\n' "$MPIPS_VERSION" > "$REMOTE_PATH/.mpips-worker-image"

      - name: Show failed deployment logs
        if: failure()
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file /dev/null -f "$REMOTE_PATH/docker-compose.prod.yml" \
            logs --no-color --tail=200 || true
          test ! -f "$REMOTE_PATH/launcher.log" || tail -200 "$REMOTE_PATH/launcher.log"
