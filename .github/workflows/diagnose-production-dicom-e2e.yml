name: Diagnose Production DICOM E2E

on:
  workflow_dispatch:

concurrency:
  group: mpips-internal-beta
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra service --extra dev --extra npz-worker --extra imager
      - name: Run production diagnostic
        env:
          MPIPS_API_KEY: ${{ secrets.MPIPS_API_KEY }}
        run: uv run python scripts/diagnose_production_dicom_e2e.py --summary "$GITHUB_STEP_SUMMARY"
