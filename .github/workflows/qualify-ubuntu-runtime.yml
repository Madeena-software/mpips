name: Qualify Ubuntu Local Runtime Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'mpips/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/integration/**'
      - '.github/workflows/qualify-ubuntu-runtime.yml'

permissions:
  contents: read

jobs:
  qualify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing locked development closure
        run: |
          python -m pip install 'uv==0.12.5' 'pip-audit==2.10.1'
          uv sync --frozen --extra service --extra dev --extra imager --extra calibration
          uv lock --check
      - name: Audit local runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/runtime-deps.txt" > /dev/null
          pip-audit --require-hashes -r "$RUNNER_TEMP/runtime-deps.txt"
      - name: Source checks and converter protection
        run: |
          uv run black --check mpips tests scripts/build_runtime.py scripts/runtime_release.py scripts/release_reference_server.py scripts/publish_runtime.py scripts/grabber_smoke.py scripts/simrs_manifest_example.py
          uv run flake8 mpips tests scripts/build_runtime.py scripts/runtime_release.py scripts/release_reference_server.py scripts/publish_runtime.py scripts/grabber_smoke.py scripts/simrs_manifest_example.py
          uv run python scripts/check_mypy_regressions.py --base-ref '${{ github.event.pull_request.base.sha }}' --candidate-ref HEAD
          uv run pytest -q
      - name: Build, offline install, and execute synthetic BED/TRX DICOM
        run: |
          uv run --with pip==26.2.1 python scripts/build_runtime.py --commit HEAD --sequence 1 --output "$RUNNER_TEMP/mpips-candidate"
      # No upload, signing secrets, publication or promotion. Licensing review is open.
