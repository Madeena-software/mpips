name: Verify Production Real BED Image Integrity

on:
  workflow_dispatch:

concurrency:
  group: mpips-internal-beta
  cancel-in-progress: false

jobs:
  verify:
    name: Verify real BED image integrity
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra service

      - name: Verify production real BED image integrity
        env:
          MPIPS_API_KEY: ${{ secrets.MPIPS_API_KEY }}
        run: .venv/bin/python scripts/verify_production_real_bed_image_integrity.py
