name: Measure MPIPS Internal Beta Performance

on:
  workflow_dispatch:

concurrency:
  group: mpips-internal-beta
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  measure:
    name: Production Capacity Benchmark
    runs-on: [self-hosted, production]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          python -m pip install "uv==0.12.5"
          uv sync --frozen --extra service --extra dev --extra npz-worker --extra imager

      - name: Set deployment variables
        env:
          MPIPS_API_KEY_SECRET: ${{ secrets.MPIPS_API_KEY }}
        run: |
          if [ -z "${MPIPS_API_KEY_SECRET:-}" ]; then
            echo "ERROR: secrets.MPIPS_API_KEY is not set or empty! Fail closed."
            exit 1
          fi
          echo "REMOTE_PATH=/var/www/mpips-runtime" >> "$GITHUB_ENV"
          echo "MPIPS_API_KEY=${MPIPS_API_KEY_SECRET}" >> "$GITHUB_ENV"
          echo "BENCHMARK_SOURCE_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Server identity proof & environment capture
        run: |
          mkdir -p performance-output
          {
            echo "=== SERVER IDENTITY PROOF ==="
            echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Hostname: $(hostname)"
            echo "Kernel: $(uname -a)"
            echo "Runner Name: ${RUNNER_NAME:-simama-production-server}"
            echo "Runner Group: madeena-devops"
            echo "GitHub SHA: ${{ github.sha }}"
            echo "Logical CPU Count: $(nproc)"
            echo "Memory Info:"
            free -h
            echo "Uptime & Load:"
            uptime
            echo "Docker Version:"
            docker version --format '{{.Server.Version}}' || docker version
            echo "============================="
          } | tee performance-output/server-environment.txt

      - name: Baseline health & authenticated conversion gate
        run: |
          set -Eeuo pipefail
          echo "1. Checking baseline health on http://127.0.0.1:8014/health..."
          health_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8014/health)
          if [ "$health_status" != "200" ]; then
            echo "ERROR: Baseline health check failed with status $health_status (expected 200). Stopping benchmark."
            exit 1
          fi
          echo "Baseline health: 200 OK"

          echo "2. Preparing production-shaped burn-in fixtures..."
          uv run python scripts/local_dicom_burn_in.py \
            --base-dir "$REMOTE_PATH/burn-in" prepare

          echo "3. Executing ONE single baseline authenticated DICOM conversion..."
          sample_job_id=$(uv run python -c "import uuid; print(uuid.uuid4())")
          raw_json="$REMOTE_PATH/burn-in/fixtures/manifest.json"
          prep_json="$RUNNER_TEMP/baseline_manifest.json"
          uv run python -c "import json, copy; m=json.load(open('$raw_json')); m['conversion_job_id']='$sample_job_id'; open('$prep_json','w').write(json.dumps(m))"

          resp_headers="$RUNNER_TEMP/baseline_headers.txt"
          resp_body="$RUNNER_TEMP/baseline_output.dcm"

          status_code=$(curl -sS -D "$resp_headers" -o "$resp_body" -w '%{http_code}' \
            -H "X-MPIPS-API-Key: $MPIPS_API_KEY" \
            -F "radiograph_npz=@$REMOTE_PATH/burn-in/fixtures/radiograph.npz" \
            -F "gain_npz=@$REMOTE_PATH/burn-in/fixtures/gain.npz" \
            -F "manifest=@$prep_json" \
            http://127.0.0.1:8014/v1/radiographs/dicom)

          if [ "$status_code" != "200" ]; then
            echo "ERROR: Baseline conversion check failed with status $status_code (expected 200)."
            cat "$resp_headers" || true
            exit 1
          fi

          echo "4. Validating baseline returned DICOM..."
          uv run python -c "
          import pydicom
          ds = pydicom.dcmread('$resp_body')
          assert ds.BitsAllocated == 16 and ds.PixelRepresentation == 0, 'Must be uint16'
          assert not any(el.tag.is_private for el in ds.iterall()), 'No private tags'
          print(f'Baseline DICOM Valid: {ds.Rows}x{ds.Columns} uint16, TransferSyntax={ds.file_meta.TransferSyntaxUID}')
          "
          echo "Baseline health & valid conversion gate PASSED!"

      - name: Run production server performance measurement suite with background sampling
        run: |
          set -Eeuo pipefail

          echo "Starting background resource sampler..."
          LOG_FILE="performance-output/resource-samples.log"
          {
            echo "=== SERVER RESOURCE SAMPLING LOG ==="
            echo "Start Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$LOG_FILE"

          (
            while true; do
              {
                echo "--- SAMPLE $(date -u +'%Y-%m-%dT%H:%M:%SZ') ---"
                echo "LOAD: $(uptime)"
                echo "MEM: $(free -h | grep Mem:)"
                echo "DOCKER STATS:"
                docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" || true
                echo "RUNNING WORKERS: $(docker ps --filter 'name=mpips' --format '{{.Names}} ({{.Status}})' | tr '\n' ' ')"
                echo ""
              } >> "$LOG_FILE" 2>&1
              sleep 2
            done
          ) &
          SAMPLER_PID=$!

          cleanup_sampler() {
            echo "Stopping background resource sampler (PID $SAMPLER_PID)..."
            kill "$SAMPLER_PID" || true
            wait "$SAMPLER_PID" 2>/dev/null || true
          }
          trap cleanup_sampler EXIT

          echo "Running benchmark measurement suite..."
          uv run python scripts/measure_dicom_performance.py \
            --url http://127.0.0.1:8014 \
            --fixture-dir "$REMOTE_PATH/burn-in/fixtures" \
            --output-dir performance-output

          cleanup_sampler
          trap - EXIT
          echo "Performance measurement suite completed successfully!"

      - name: Upload performance benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mpips-performance-results
          path: performance-output/
