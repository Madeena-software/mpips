name: Deploy MPIPS Docker Swarm Stack

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-verify-and-deploy:
    name: Build, Verify and Deploy Swarm Stack
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra service --extra dev --extra npz-worker

      - name: Run Converter Hash Immutability Gate
        run: |
          EXPECTED_HASH="a4a308661ebe8e418bbecd6f30af1b59eae3ee019fc4256b03b323be3c6706e0"
          ACTUAL_HASH=$(sha256sum mpips/engine/imager_pipeline/tiff_json_to_dcm.py | awk '{print $1}')
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "CRITICAL: Converter implementation was modified!"
            exit 1
          fi

      - name: Run Code Quality Checks
        run: |
          uv run black --check mpips tests
          uv run flake8 mpips tests
          uv run mypy mpips tests

      - name: Run Full Test Suite
        run: |
          uv run pytest -v

      - name: Build mpips-api Image
        run: |
          docker build -t mpips-api:latest -f Dockerfile .

      - name: Build mpips-npz-worker Image
        run: |
          docker build -t mpips-npz-worker:latest -f docker/Dockerfile.worker .

      - name: Synthetic NPZ Worker Conversion Verification
        run: |
          uv run pytest tests/api/test_dicom_conversion.py -k test_worker_passes_map_x_and_map_y_to_process_radiography_arrays

      - name: Deploy Docker Swarm Stack
        run: |
          docker stack deploy -c docker-compose.prod.yml mpips

      - name: Wait for API Health
        run: |
          echo "Polled health check starting..."
          HEALTH_OK=false
          for i in $(seq 1 30); do
            if curl -s --fail http://localhost:8000/health > /dev/null 2>&1 || curl -s --fail http://localhost/health > /dev/null 2>&1; then
              echo "MPIPS API is HEALTHY!"
              HEALTH_OK=true
              break
            fi
            echo "Waiting for API service... attempt $i/30"
            sleep 2
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "ERROR: Deployment failed API health check!"
            docker service logs mpips_mpips-api || true
            exit 1
          fi

      - name: Run Synthetic DICOM End-to-End Smoke Test
        run: |
          uv run pytest tests/api/test_dicom_conversion.py -k test_successful_dicom_conversion_endpoint
