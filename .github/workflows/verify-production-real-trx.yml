name: Verify Production Real TRX Acceptance

on:
  workflow_dispatch:

concurrency:
  group: mpips-internal-beta
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, production]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra service
      - name: Verify production real TRX acceptance
        env:
          MPIPS_API_KEY: ${{ secrets.MPIPS_API_KEY }}
        run: uv run --with "gdown==6.1.0" python -m scripts.verify_production_real_trx --summary "$GITHUB_STEP_SUMMARY"
