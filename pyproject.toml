[project]
name = "mpips"
version = "0.1.0"
description = "Madeena Image Pipeline Scientific Execution Microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "cryptography>=48.0.1",
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

