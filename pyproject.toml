[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpips"
version = "0.1.0"
description = "Madeena Image Pipeline Scientific Execution Microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0.80",
    "pydantic>=2.13.4",
    "scipy>=1.12.0",
    "scikit-image>=0.22.0",
    "PyWavelets>=1.5.0",
]

[project.optional-dependencies]
api = [
    "cryptography>=48.0.1",
    "fastapi>=0.136.3",
    "pyjwt>=2.13.0",
    "uvicorn>=0.49.0",
]
worker = [
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "redis>=8.0.0",
]
s3 = [
    "boto3>=1.43.28",
]
service = [
    "boto3>=1.43.28",
    "celery>=5.6.3",
    "cryptography>=48.0.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]
dev = [
    "boto3>=1.43.28",
    "black>=26.5.1",
    "celery>=5.6.3",
    "cryptography>=48.0.1",
    "fastapi>=0.136.3",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "moto>=5.2.2",
    "mypy>=2.1.0",
    "pyjwt>=2.13.0",
    "pytest>=9.0.3",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
mpips-api = "mpips.cli:run_api"
mpips-worker = "mpips.cli:run_worker"

[dependency-groups]
dev = [
    "boto3>=1.43.28",
    "black>=26.5.1",
    "celery>=5.6.3",
    "cryptography>=48.0.1",
    "fastapi>=0.136.3",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "moto>=5.2.2",
    "mypy>=2.1.0",
    "pyjwt>=2.13.0",
    "pytest>=9.0.3",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "mpips*",
]
exclude = [
    "tests*",
]

[tool.setuptools.package-data]
mpips = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py312']
extend-exclude = '''
/(
  research
  | mpips\.egg-info
)/
'''

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "^research/",
    "^mpips\\.egg-info/",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
